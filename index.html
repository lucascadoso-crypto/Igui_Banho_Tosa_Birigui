
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00BFA5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Igui Birigui">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>iG Banho e Tosa - ERP Admin</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .nav-item-active { background-color: #4f46e5; color: white; }
        
        /* Esconder scrollbar mantendo o scroll funcional */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 767px) {
            html,
            body,
            #root {
                min-height: 100vh;
                min-height: 100dvh;
                overflow-x: hidden;
                background: #f8fafc;
            }

            body {
                overscroll-behavior-y: none;
                -webkit-tap-highlight-color: transparent;
            }

            .app-mobile-header {
                height: calc(76px + env(safe-area-inset-top)) !important;
                padding-top: env(safe-area-inset-top) !important;
                box-sizing: border-box !important;
            }

            .app-mobile-main {
                padding-top: calc(76px + env(safe-area-inset-top)) !important;
            }

            .app-modal-overlay {
                align-items: flex-start !important;
                justify-content: center !important;
                padding-top: max(12px, env(safe-area-inset-top)) !important;
                padding-right: 10px !important;
                padding-bottom: max(12px, env(safe-area-inset-bottom)) !important;
                padding-left: 10px !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                box-sizing: border-box !important;
            }

            .app-modal-panel {
                width: calc(100vw - 20px) !important;
                max-width: calc(100vw - 20px) !important;
                height: auto !important;
                max-height: 90vh !important;
                max-height: min(90vh, calc(100dvh - 24px)) !important;
                margin: 0 auto !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                box-sizing: border-box !important;
                transform: none !important;
                border-radius: 1.75rem !important;
            }

            .app-modal-header {
                position: sticky !important;
                top: 0 !important;
                z-index: 30 !important;
                box-sizing: border-box !important;
            }

            .app-modal-body {
                min-height: 0 !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                box-sizing: border-box !important;
            }

            .app-modal-footer {
                position: sticky !important;
                bottom: 0 !important;
                z-index: 30 !important;
                padding-bottom: max(1rem, env(safe-area-inset-bottom)) !important;
                box-sizing: border-box !important;
            }

            .app-modal-footer,
            .app-modal-footer > div {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            .app-modal-footer button,
            .app-modal-body button,
            .app-modal-body input,
            .app-modal-body select,
            .app-modal-body textarea,
            .app-modal-panel input,
            .app-modal-panel select,
            .app-modal-panel textarea {
                max-width: 100% !important;
                box-sizing: border-box !important;
            }

            .app-modal-footer button {
                width: 100% !important;
                min-height: 44px !important;
                white-space: normal !important;
            }

            .app-modal-body input,
            .app-modal-body select,
            .app-modal-body textarea,
            .app-modal-panel form input,
            .app-modal-panel form select,
            .app-modal-panel form textarea {
                width: 100% !important;
                font-size: 16px !important;
            }

            .app-modal-panel table {
                max-width: 100% !important;
            }
        }
    </style>
<script type="importmap">
{

  }
}

</html>
